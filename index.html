<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0B0E" />
    <meta name="color-scheme" content="dark light" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('rohan_portfolio_theme');
          var theme = (saved === 'cyber' || saved === 'daylight') ? saved : 'midnight';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = (theme === 'daylight') ? 'light' : 'dark';
          var metaColor = document.querySelector('meta[name="theme-color"]');
          if (metaColor) {
            metaColor.setAttribute('content', theme === 'daylight' ? '#FBFBF9' : (theme === 'cyber' ? '#06070B' : '#0A0B0E'));
          }
        } catch (e) {}
      })();
    </script>
    
    <!-- Primary Meta Tags -->
    <title>Rohan Patil — Software, AI & Security | VJTI Mumbai</title>
    <meta name="title" content="Rohan Patil — Software, AI & Security | VJTI Mumbai" />
    <meta name="description" content="Portfolio of Rohan Patil, Computer Engineering student at VJTI Mumbai with Minor in Cybersecurity. Building useful full-stack web applications, AI integrations, and secure systems." />
    <meta name="author" content="Rohan Patil" />
    <meta name="keywords" content="Rohan Patil, VJTI Mumbai, Computer Engineering, Full-Stack Developer, AI Enthusiast, Cybersecurity, Node.js, Express, MongoDB, Content-Forge, Edukeeda" />
    
    <!-- Preload Cinematic Intro Portrait -->
    <link rel="preload" as="image" href="/images/rohan-portrait.png" fetchpriority="high" />

    <!-- Fonts: Syne (Editorial Display), Plus Jakarta Sans (Primary Body/UI), JetBrains Mono (Technical Accents) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
